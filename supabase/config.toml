[auth]
site_url = "https://cmimap.com"
additional_redirect_urls = [
  "https://cmimap.com/**",
  "https://*.cmi-map.pages.dev/**",
  "http://127.0.0.1:5173/**",
  "http://127.0.0.1:5174/**",
  "http://127.0.0.1:5175/**",
  "http://127.0.0.1:5176/**",
  "http://127.0.0.1:5177/**",
  "http://127.0.0.1:5178/**",
  "http://127.0.0.1:5179/**",
  "http://localhost:5173/**",
  "http://localhost:5174/**",
  "http://localhost:5175/**",
  "http://localhost:5176/**",
  "http://localhost:5177/**",
  "http://localhost:5178/**",
  "http://localhost:5179/**",
]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "CMI Map 注册验证码"
content_path = "./supabase/templates/auth-confirmation.html"

[auth.email.template.magic_link]
subject = "CMI Map 登录验证码"
content_path = "./supabase/templates/auth-magic-link.html"

[auth.email.template.recovery]
subject = "CMI Map 密码找回验证码"
content_path = "./supabase/templates/auth-recovery.html"

[functions.cmi-admin-agent]
verify_jwt = false

[functions.notify-cmi-event-application]
verify_jwt = true
