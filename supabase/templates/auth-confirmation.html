<!doctype html>
<html lang="zh-CN">
  <body style="margin: 0; padding: 24px; background: #f6f4fb; color: #25252a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <main style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 28px; border: 1px solid #e6e0f2;">
      <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3;">CMI Map 注册验证码</h1>
      <p style="margin: 0 0 18px; color: #6f6f77; font-size: 15px; line-height: 1.6;">把下面的 6 位验证码填回 CMI Map 注册页，完成邮箱验证。</p>
      <p style="margin: 0 0 18px; font-size: 32px; line-height: 1; font-weight: 800; letter-spacing: 8px; color: #7c5ab8;">{{ .Token }}</p>
      <p style="margin: 0; color: #8b8b92; font-size: 13px; line-height: 1.6;">验证码 1 小时内有效。如果不是你本人操作，可以忽略这封邮件。</p>
    </main>
  </body>
</html>
