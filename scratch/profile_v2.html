<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Map · Profile Playground — 方案② 紧凑横排</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #e8e4de;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  :root {
    --bg: #f9f9f7;
    --card: #ffffff;
    --fg: #2c2c2c;
    --muted: #78716c;
    --primary: #9b8ec6;
    --primary-light: #ede9fe;
    --border: #e7e5e4;
    --rose: #f43f5e;
  }

  .phone {
    width: 390px;
    min-height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
  }

  /* === Top nav === */
  .topbar {
    padding: 52px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .topbar-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--fg);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-btn:hover { background: rgba(0,0,0,0.05); }

  /* === Compact horizontal header === */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px 16px;
  }
  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2.5px solid var(--fg);
    background: #e8e0d8;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    object-fit: cover;
  }
  .cam-btn {
    position: absolute; bottom: -2px; right: -2px;
    width: 26px; height: 26px;
    background: var(--primary); color: white;
    border-radius: 50%;
    border: 2px solid var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    box-shadow: 1px 2px 0 rgba(0,0,0,0.15);
    cursor: pointer;
  }

  .header-info {
    flex: 1;
    min-width: 0;
  }
  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .display-name {
    font-size: 22px;
    font-weight: 900;
    color: var(--fg);
    line-height: 1.1;
  }
  .edit-icon {
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }
  .bio-text {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .stats-row {
    display: flex;
    gap: 16px;
  }
  .stat-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .stat-num {
    font-size: 18px;
    font-weight: 900;
    color: var(--fg);
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }

  /* === Scroll area === */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
  }

  /* === Tab bar === */
  .tab-bar {
    display: flex;
    border-bottom: 2px solid var(--border);
    padding: 0 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 13px 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 12px; right: 12px;
    height: 2.5px;
    background: var(--fg);
    border-radius: 2px;
  }
  .tab.active-rose { color: var(--rose); }
  .tab.active-rose::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 12px; right: 12px;
    height: 2.5px;
    background: var(--rose);
    border-radius: 2px;
  }
  .tab.active-primary { color: var(--primary); }
  .tab.active-primary::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 12px; right: 12px;
    height: 2.5px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* === Category pills === */
  .pills {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
  }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .pill:hover { border-color: var(--fg); }
  .pill.active {
    background: var(--primary);
    color: white;
    border-color: var(--fg);
  }

  /* === Content === */
  .content { padding: 0 20px 32px; }

  /* === Empty state === */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    text-align: center;
    gap: 14px;
  }
  .empty-icon { font-size: 48px; opacity: 0.6; }
  .empty-text { font-size: 14px; color: var(--muted); font-weight: 500; }
  .cta {
    padding: 12px 24px;
    background: var(--primary);
    color: white;
    border-radius: 24px;
    font-weight: 800;
    font-size: 14px;
    border: 2.5px solid var(--fg);
    box-shadow: 3px 4px 0 rgba(0,0,0,0.18);
    cursor: pointer;
    transition: all 0.12s;
  }
  .cta:active { transform: translate(2px,3px); box-shadow: 0 0 0; }

  /* === Rec card === */
  .rec-card {
    display: flex;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 2px solid var(--fg);
    border-radius: 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .rec-card:hover { transform: translateY(-2px) rotate(0.5deg); }
  .rec-card + .rec-card { margin-top: 12px; }
  .rec-thumb {
    width: 64px; height: 64px;
    border-radius: 12px;
    flex-shrink: 0;
    background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .rec-info { flex: 1; min-width: 0; }
  .rec-quote {
    font-size: 13px;
    line-height: 1.5;
    font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 6px;
  }
  .rec-meta {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .heat { background: rgba(155,142,198,0.15); color: var(--primary); font-weight: 800; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  /* === Badge grid === */
  .badge-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    padding: 8px 0;
  }
  .badge-item { text-align: center; }
  .badge-icon {
    width: 52px; height: 52px;
    margin: 0 auto 6px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    border: 2px solid var(--border);
    background: var(--card);
    transition: transform 0.15s;
  }
  .badge-icon:hover { transform: scale(1.1); }
  .badge-icon.on { background: var(--primary-light); border-color: var(--primary); box-shadow: 0 2px 8px rgba(155,142,198,0.3); }
  .badge-icon.off { opacity: 0.3; filter: grayscale(1); }
  .badge-label { font-size: 10px; font-weight: 700; color: var(--muted); }

  /* === Section label for demo === */
  .demo-label {
    font-size: 11px; font-weight: 800; color: var(--primary);
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 20px 0 8px;
    border-top: 1px dashed var(--border);
    margin-top: 20px;
  }

  /* Interactive tab switching */
  .tab-panel { display: none; }
  .tab-panel.show { display: block; }
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <button class="topbar-btn">←</button>
    <button class="topbar-btn" style="font-size:16px;" title="退出登录">⎋</button>
  </div>

  <!-- ======== COMPACT HORIZONTAL HEADER ======== -->
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar">🐱</div>
      <div class="cam-btn">📷</div>
    </div>
    <div class="header-info">
      <div class="name-row">
        <span class="display-name">子扬</span>
        <span class="edit-icon">✎</span>
      </div>
      <div class="bio-text">清迈数字游民 · 社区建设者</div>
      <div class="stats-row">
        <div class="stat-item"><span class="stat-num">0</span><span class="stat-label">贡献</span></div>
        <div class="stat-item"><span class="stat-num">1</span><span class="stat-label">想去</span></div>
        <div class="stat-item"><span class="stat-num">1</span><span class="stat-label">成就</span></div>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <!-- ======== TAB BAR ======== -->
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab(0)">我贡献的 (0)</div>
      <div class="tab" onclick="switchTab(1)">我想去的 (1)</div>
      <div class="tab" onclick="switchTab(2)">成就 (1)</div>
    </div>

    <!-- ======== TAB 0: 我贡献的 (empty) ======== -->
    <div class="tab-panel show" id="panel-0">
      <div class="pills">
        <span class="pill active">🎲 全部</span>
        <span class="pill">🍜 吃饭</span>
        <span class="pill">☕ 咖啡</span>
        <span class="pill">🌿 户外</span>
        <span class="pill">📸 拍照</span>
        <span class="pill">🛍️ 市集</span>
        <span class="pill">💆 马杀鸡</span>
      </div>
      <div class="content">
        <div class="empty">
          <div class="empty-icon">📝</div>
          <div class="empty-text">手账本里还没有你的专属印记</div>
          <button class="cta">去标记一个心动坐标</button>
        </div>
      </div>
    </div>

    <!-- ======== TAB 1: 我想去的 (with data) ======== -->
    <div class="tab-panel" id="panel-1">
      <div class="pills">
        <span class="pill active">🎲 全部</span>
        <span class="pill">🍜 吃饭</span>
        <span class="pill">☕ 咖啡</span>
        <span class="pill">🌿 户外</span>
        <span class="pill">📸 拍照</span>
        <span class="pill">🛍️ 市集</span>
        <span class="pill">💆 马杀鸡</span>
      </div>
      <div class="content">
        <div class="rec-card">
          <div class="rec-thumb">☕</div>
          <div class="rec-info">
            <div class="rec-quote">"很安静的小巷子咖啡馆，下午三点的阳光打在木桌上，适合发呆一个下午"</div>
            <div class="rec-meta">
              <span>📍 Ristr8to Lab</span>
              <span>—— 小明</span>
              <span class="heat">🔥 3</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ======== TAB 2: 成就 ======== -->
    <div class="tab-panel" id="panel-2">
      <div class="content" style="padding-top:16px;">
        <div class="badge-grid">
          <div class="badge-item">
            <div class="badge-icon on">🌱</div>
            <div class="badge-label">初来乍到</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">📍</div>
            <div class="badge-label">第一笔</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">☕</div>
            <div class="badge-label">咖啡达人</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">🗺️</div>
            <div class="badge-label">探索者</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">🔥</div>
            <div class="badge-label">热心人</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">📸</div>
            <div class="badge-label">摄影师</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">🍜</div>
            <div class="badge-label">老饕</div>
          </div>
          <div class="badge-item">
            <div class="badge-icon off">⭐</div>
            <div class="badge-label">传奇</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  function switchTab(idx) {
    // Tabs
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.className = 'tab' + (i === idx ? (i === 1 ? ' active-rose' : i === 2 ? ' active-primary' : ' active') : '');
    });
    // Panels
    document.querySelectorAll('.tab-panel').forEach((p, i) => {
      p.className = 'tab-panel' + (i === idx ? ' show' : '');
    });
  }
</script>

</body>
</html>
