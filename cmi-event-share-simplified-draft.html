<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMI Map 活动分享卡简化草稿</title>
    <style>
      :root {
        --ink: #050505;
        --purple: #8d62ef;
        --purple-deep: #160f25;
        --yellow: #ffe35b;
        --cream: #fff7df;
        --card-pad: clamp(30px, 4vw, 46px);
        --module-gap: clamp(22px, 3vw, 30px);
        --corner-xl: 52px;
        --corner-lg: 36px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: start center;
        padding: 28px 16px 56px;
      }

      .share-card {
        width: min(100%, 1080px);
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: var(--corner-xl);
        background:
          radial-gradient(circle at 1px 1px, rgba(5, 5, 5, 0.1) 1px, transparent 0) 0 0 / 24px 24px,
          linear-gradient(180deg, #9b74f4 0%, #8b61ee 48%, #8359e7 100%);
        box-shadow: 0 22px 0 rgba(255, 247, 223, 0.72);
        padding: var(--card-pad);
      }

      .brand-row {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        row-gap: 10px;
        margin-bottom: var(--module-gap);
      }

      .brand-name {
        grid-column: 1 / -1;
        margin: 0;
        font-size: clamp(54px, 6.3vw, 76px);
        font-weight: 1000;
        line-height: 0.92;
        letter-spacing: 0;
      }

      .slogan-art {
        grid-column: 1 / -1;
        width: min(100%, 690px);
        height: clamp(58px, 7.6vw, 78px);
        margin: 0;
        overflow: visible;
      }

      .slogan-art text {
        fill: rgba(5, 5, 5, 0.72);
        font-family: "HanziPen SC", "Hannotate SC", "Xingkai SC", "Kaiti SC", "STKaiti", "KaiTi", cursive;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 1px;
        paint-order: stroke;
        stroke: rgba(142, 98, 239, 0.16);
        stroke-width: 2px;
      }

      .slogan-art .slogan-underline {
        fill: none;
        stroke: var(--yellow);
        stroke-width: 9px;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, 0.18));
      }

      .slogan-art .slogan-underline-shadow {
        fill: none;
        stroke: rgba(5, 5, 5, 0.64);
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-dasharray: 18 14;
      }

      .poster {
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: var(--corner-lg);
        background: #efe2bd;
      }

      .poster img {
        display: block;
        width: 100%;
        height: auto;
      }

      .copy-card {
        margin-top: var(--module-gap);
        border: 4px solid var(--ink);
        border-radius: 30px;
        background: var(--purple-deep);
        padding: clamp(22px, 3vw, 30px);
        color: white;
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.22);
      }

      .copy-text {
        margin: 0;
        max-width: 900px;
        color: rgba(255, 255, 255, 0.94);
        font-size: clamp(25px, 2.8vw, 34px);
        font-weight: 1000;
        line-height: 1.32;
        letter-spacing: 0;
        text-wrap: pretty;
      }

      .bottom-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 20px;
        margin-top: var(--module-gap);
        border: 4px solid rgba(5, 5, 5, 0.2);
        border-radius: 30px;
        background: rgba(255, 247, 223, 0.2);
        padding: 20px;
      }

      .event-facts {
        display: grid;
        gap: 12px;
        align-content: center;
        min-height: 194px;
        padding: 8px 8px 8px 18px;
      }

      .fact {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        align-items: baseline;
        gap: 16px;
      }

      .fact-label {
        color: rgba(5, 5, 5, 0.5);
        font-size: clamp(17px, 1.85vw, 22px);
        font-weight: 950;
      }

      .fact-value {
        font-size: clamp(26px, 3vw, 36px);
        font-weight: 1000;
        line-height: 1.04;
        white-space: nowrap;
      }

      .qr-card {
        display: grid;
        min-height: 194px;
        place-items: center;
        border-left: 3px dashed rgba(5, 5, 5, 0.22);
        padding: 0 0 0 22px;
      }

      .qr-box {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .qr-card img {
        display: block;
        width: 184px;
        height: 184px;
        border: 7px solid white;
        border-radius: 18px;
        background: white;
      }

      .map-url {
        margin: 0;
        color: rgba(5, 5, 5, 0.72);
        font-size: 20px;
        font-weight: 950;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      @media (max-width: 640px) {
        .page {
          padding: 12px;
        }

        .share-card {
          border-width: 3px;
          border-radius: 30px;
          padding: 20px 18px 22px;
          box-shadow: 0 10px 0 rgba(255, 247, 223, 0.72);
        }

        .brand-row {
          row-gap: 7px;
          margin-bottom: 18px;
        }

        .brand-name {
          font-size: clamp(46px, 12.2vw, 62px);
        }

        .slogan-art {
          height: 54px;
        }

        .slogan-art text {
          font-size: 43px;
        }

        .poster {
          border-width: 3px;
          border-radius: 22px;
        }

        .copy-card {
          margin-top: 18px;
          border-width: 3px;
          border-radius: 22px;
          padding: 18px;
        }

        .copy-text {
          font-size: clamp(23px, 5.35vw, 28px);
          line-height: 1.34;
        }

        .bottom-row {
          grid-template-columns: minmax(0, 1fr) 150px;
          gap: 12px;
          margin-top: 16px;
          border-width: 2px;
          border-radius: 20px;
          padding: 14px;
        }

        .event-facts {
          min-height: 0;
          gap: 8px;
          padding: 6px 0;
        }

        .qr-card {
          min-height: 0;
          border-left-width: 2px;
          padding: 0 0 0 12px;
        }

        .fact {
          grid-template-columns: 56px 1fr;
          gap: 8px;
        }

        .fact-label {
          font-size: 18px;
        }

        .fact-value {
          font-size: clamp(23px, 5.1vw, 27px);
        }

        .qr-card img {
          width: 126px;
          height: 126px;
          border-width: 5px;
          border-radius: 14px;
        }

        .qr-box {
          gap: 8px;
        }

        .map-url {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article class="share-card" aria-label="CMI Map 活动分享卡草稿">
        <header class="brand-row">
          <h1 class="brand-name">CMI Map</h1>
          <svg class="slogan-art" viewBox="0 0 760 90" role="img" aria-label="清迈活动和好去处，都在这里">
            <path id="sloganCurve" d="M 0 38 C 168 16, 344 54, 520 32 S 710 34, 756 44" fill="none" />
            <text>
              <textPath href="#sloganCurve" startOffset="0%">清迈活动和好去处，都在这里</textPath>
            </text>
            <path class="slogan-underline-shadow" d="M 4 72 C 158 54, 330 78, 492 64 S 686 58, 742 70" />
            <path class="slogan-underline" d="M 0 69 C 156 51, 328 75, 490 61 S 686 56, 742 67" />
          </svg>
        </header>

        <section class="poster">
          <img
            src="public/cmi-home/event-posters/cmi-financial-literacy-sharing-2026-05-29.png"
            alt="穷姐姐财商分享大会活动海报"
          />
        </section>

        <section class="copy-card" aria-label="活动简介">
          <p class="copy-text">给清迈旅居者的一场财商分享。聊理财工具、收入安全垫和风险识别，帮你把钱包和生活重新理顺。</p>
        </section>

        <section class="bottom-row" aria-label="活动关键信息">
          <div class="event-facts">
            <div class="fact">
              <div class="fact-label">时间</div>
              <div class="fact-value">5/29 19:00</div>
            </div>
            <div class="fact">
              <div class="fact-label">地点</div>
              <div class="fact-value">清迈客栈</div>
            </div>
            <div class="fact">
              <div class="fact-label">费用</div>
              <div class="fact-value">免费/随喜</div>
            </div>
          </div>

          <div class="qr-card">
            <div class="qr-box">
              <img src="public/cmi-home/qr-cmi-map-root.png" alt="CMI Map 网页二维码" />
              <p class="map-url">cmimap.com</p>
            </div>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
